# Site Settings
title                    : "Siyuan Li's Academic Homepage"
description              : "Shanghai Jiao Tong University"
repository               : "SiyuanLi00/siyuanli00.github.io"
url: "https://siyuanli00.github.io"
baseurl: ""
google_scholar_stats_use_cdn : false
# google analytics
google_analytics_id      :  
# SEO Related 
google_site_verification :  
bing_site_verification   :  
baidu_site_verification  :  
# Site Author
author:
  name             : "Siyuan Li"
  avatar           : "/images/profile.png"
  bio              : 
  location         : "Shanghai, China"
  employer         :
  pubmed           :
  googlescholar    : "https://scholar.google.com/citations?user=7w89fusAAAAJ"
  email            : "siyuanli@sjtu.edu.cn"
  researchgate     : "https://www.researchgate.net/"
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : 
  google_plus      :
  keybase          :
  instagram        :
  impactstory      : 
  lastfm           :
  linkedin         : 
  dblp             : 
  orcid            : "https://orcid.org/0000-0002-5045-9472"
  pinterest        :
  soundcloud       :
  stackoverflow    : 
  steam            :
  tumblr           :
  twitter          : 
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :
# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true
# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai
# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
