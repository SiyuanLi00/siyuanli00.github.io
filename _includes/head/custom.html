<style>
  /* ===== 大气导航栏：标题左、导航右、同一行 ===== */
  .masthead { border-bottom:1px solid #e8e8e8; padding:1.1em 0; background:#fff; }
  .masthead .greedy-nav { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .masthead .site-title { font-size:1.65em; font-weight:700; letter-spacing:.8px; color:#1a1a1a; flex:none; text-decoration:none; }
  .masthead .site-title:hover { color:#2c5f9e; }
  .masthead .visible-links { display:flex; align-items:center; gap:2.2em; margin:0; padding:0; list-style:none; }
  .masthead .visible-links li { margin:0; }
  .masthead .visible-links a { font-size:1.08em; font-weight:500; color:#555; letter-spacing:.5px; text-transform:uppercase; position:relative; padding:.3em 0; transition:color .2s ease; text-decoration:none; }
  .masthead .visible-links a::after { content:''; position:absolute; bottom:0; left:0; width:0; height:2px; background:#2c5f9e; transition:width .25s ease; }
  .masthead .visible-links a:hover { color:#1a1a1a; }
  .masthead .visible-links a:hover::after { width:100%; }


  /* ===== 顶部大标题 Hi, I am Siyuan Li ===== */
  .intro h1 { font-size:2.2em; font-weight:700; color:#1a1a1a; margin:0 0 .3em; letter-spacing:.5px; }
  .intro p { color:#444; line-height:1.7; }

  /* ===== 板块标题（大号大写 + 前置小图标） ===== */
  .sec { margin:2.8em 0 1em; }
  .sec h2 { font-size:1.7em; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#1a1a1a; margin:0; display:flex; align-items:center; gap:.5em; }
  .sec h2 .sec-icon { width:2em; height:2em; border-radius:8px; background:#eef3fa; color:#2c5f9e; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .sec h2 .sec-icon svg { width:1.15em; height:1.15em; }

  /* ===== 研究方向卡片（统一配色 + 图标） ===== */
  .research-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.2em; margin:1.2em 0 2em; }
  .research-card { border:1px solid #e8e8e8; border-radius:14px; padding:1.5em 1.6em; background:#fff; transition:box-shadow .2s ease, transform .2s ease; }
  .research-card:hover { box-shadow:0 8px 24px rgba(0,0,0,.08); transform:translateY(-2px); }
  .research-icon { width:48px; height:48px; border-radius:12px; background:#eef3fa; color:#2c5f9e; display:flex; align-items:center; justify-content:center; margin-bottom:.9em; }
  .research-icon svg { width:26px; height:26px; }
  .research-card h3 { margin:0 0 .7em; font-size:1.12em; color:#1a1a1a; }
  .research-card ul { margin:0; padding-left:1.2em; }
  .research-card li { margin:.4em 0; font-size:.93em; color:#444; }
  @media (max-width: 600px) { .research-grid { grid-template-columns:1fr; } }
</style>
