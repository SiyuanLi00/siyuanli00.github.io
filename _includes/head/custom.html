<style>
  /* ===== 头像：强制正方形 + 圆形裁剪 ===== */

  .masthead .site-title:hover { color:#2c5f9e; }
  .masthead .visible-links { display:flex; align-items:center; gap:2.2em; margin:0; padding:0; list-style:none; }
  .masthead .visible-links li { margin:0; }
  .masthead .visible-links a { font-size:1.08em; font-weight:500; color:#555; letter-spacing:.5px; text-transform:uppercase; position:relative; padding:.3em 0; transition:color .2s ease; text-decoration:none; }
  .masthead .visible-links a::after { content:''; position:absolute; bottom:0; left:0; width:0; height:2px; background:#2c5f9e; transition:width .25s ease; }
  .masthead .visible-links a:hover { color:#1a1a1a; }
  .masthead .visible-links a:hover::after { width:100%; }
  /* ===== 顶部大标题 Hi, I am Siyuan Li ===== */

  .intro p { color:#444; line-height:1.7; }
  /* ===== 板块标题（大号大写 + 前置小图标） ===== */
  .sec { margin:2.8em 0 1em; }
  .sec h2 { font-size:1.7em; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#1a1a1a; margin:0; display:flex; align-items:center; gap:.5em; }
  .sec h2 .sec-icon { width:2em; height:2em; border-radius:8px; background:#eef3fa; color:#2c5f9e; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .sec h2 .sec-icon svg { width:1.15em; height:1.15em; }

  .research-icon { width:48px; height:48px; border-radius:12px; background:#eef3fa; color:#2c5f9e; display:flex; align-items:center; justify-content:center; margin-bottom:.9em; }

  /* ===== AISec 研究框架（嵌入版） ===== */
  .aisec-wrap { position:relative; margin:2.2em 0; padding:22px 20px 14px; border:1px solid #dbe7e4; border-radius:18px; background:linear-gradient(135deg,#f2faf8 0%,#eef4fb 100%); box-shadow:0 10px 30px rgba(15,60,90,.08); }
  .aisec-wrap::before { content:''; position:absolute; top:0; left:18px; right:18px; height:3px; border-radius:3px; background:linear-gradient(90deg,#0f766e,#5eead4,#0f766e); }
  .aisec-head { text-align:center; margin-bottom:14px; }
  .aisec-logo { font-size:30px; font-weight:800; letter-spacing:6px; color:#0f3d3a; line-height:1; }
  .aisec-logo em { font-style:normal; color:#0f766e; }
  .aisec-slogan { margin-top:6px; font-size:11px; font-weight:700; letter-spacing:3px; color:#16302e; }
  .aisec-sub { margin-top:3px; font-size:9.5px; letter-spacing:2px; color:#5b7a77; }
  .aisec-sub b { color:#0f766e; }
  .aisec-layer { display:flex; justify-content:space-between; padding:8px 4px; margin:0 0 12px; border-top:1.5px solid #dce9e6; border-bottom:1.5px solid #dce9e6; }
  .aisec-layer span { font-size:9.5px; font-weight:700; letter-spacing:1px; color:#1e635e; }
  .aisec-block { display:grid; grid-template-columns:160px 1fr; gap:16px; padding:13px 0; align-items:center; border-bottom:1px solid #e6efed; }
  .aisec-block:last-child { border-bottom:none; }
  .aisec-dtitle { font-size:15px; font-weight:800; line-height:1.3; color:#12322f; }
  .aisec-dtitle span { color:#0f766e; }
  .aisec-dnote { margin-top:5px; font-size:10.5px; line-height:1.5; color:#4c6a66; }
  .aisec-items { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .aisec-item { background:#fff; border:1px solid #dfeae7; border-radius:10px; padding:10px 4px 8px; text-align:center; box-shadow:0 2px 6px rgba(15,80,70,.05); }
  .aisec-icon { width:30px; height:30px; margin:0 auto 6px; border-radius:8px; background:#e6f4f1; color:#0f766e; display:flex; align-items:center; justify-content:center; }
  .aisec-icon svg { width:16px; height:16px; }
  .aisec-item p { font-size:10.5px; font-weight:600; color:#1f3d3a; line-height:1.3; }
  .aisec-item b { color:#12322f; }
  @media (max-width:600px){ .aisec-block{grid-template-columns:1fr;} .aisec-items{grid-template-columns:repeat(2,1fr);} }

<script>
document.addEventListener('DOMContentLoaded', function() {
  var emailLink = document.querySelector('a[href^="mailto:"]');
  if (emailLink) {
    emailLink.addEventListener('click', function(e) {
      e.preventDefault();
      var email = this.getAttribute('href').replace('mailto:', '');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(function() {
          alert('Email copied: ' + email);
        });
      } else {
        var tmp = document.createElement('textarea');
        tmp.value = email;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand('copy');
        document.body.removeChild(tmp);
        alert('Email copied: ' + email);
      }
    });
  }
});
</script>
